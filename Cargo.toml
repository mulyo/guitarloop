[package]
name = "guitarloop"
version = "0.1.0"
edition = "2021"
description = "GuitarLoop - Video player untuk latihan gitar dengan loop presisi, speed control, dan practice tools"
license = "MIT"

# ------------------------------------------------------------------

# Binary

# ------------------------------------------------------------------
[[bin]]
name = "guitarloop"
path = "src/main.rs"

# ------------------------------------------------------------------

# Dependencies

# ------------------------------------------------------------------
[dependencies]

# GUI: egui + eframe
eframe = { version = "0.28", features = ["persistence", "glow"] }
egui = "0.28"
egui_extras = { version = "0.28", features = ["image"] }

# Media: GStreamer
# (Plugin Opus/VP9/H.264 dll dimuat otomatis runtime via GStreamer registry; bukan Rust crate)
gstreamer = { version = "0.22", features = ["v1_22"] }
gstreamer-video = { version = "0.22", features = ["v1_22"] }
gstreamer-audio = { version = "0.22", features = ["v1_22"] }
gstreamer-play = { version = "0.22", features = ["v1_22"] }
gstreamer-base = { version = "0.22", features = ["v1_22"] }

# Database: SQLite
rusqlite = { version = "0.32", features = ["bundled"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Utilities
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
rfd = "0.14"  # File dialog (native) for egui
image = { version = "0.25", default-features = false, features = ["png"] }

# Windows-specific (optional, better icon support)
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["wincon"] }

# ------------------------------------------------------------------

# Profile (optimized release build)

# ------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
